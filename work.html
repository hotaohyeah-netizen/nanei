<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIワーク | 南映オンラインワーク</title>
  <meta name="description" content="英語・数学・国語・理科・社会を学べる無料のAIワークです。">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div style="padding:20px">
    <a href="index.html">
      <button>← ホームへ</button>
    </a>
  </div>

  <header>
    <h1>南映AIワーク</h1>
    <p>ログイン不要・無料でAI学習ができます</p>
  </header>

  <div class="card">
    <h2>学年と教科を選択</h2>

    <p>
      <select id="grade" style="padding: 8px;">
        <option value="中学1年生">中学1年生</option>
        <option value="中学2年生">中学2年生</option>
        <option value="中学3年生">中学3年生</option>
      </select>

      <select id="subject" style="padding: 8px;">
        <option value="英語">英語</option>
        <option value="数学">数学</option>
        <option value="国語">国語</option>
        <option value="理科">理科</option>
        <option value="社会">社会</option>
      </select>
    </p>

    <button id="genBtn" onclick="makeQuestion()">
      AIで問題を生成
    </button>
  </div>

  <div class="card" id="questions">
    <h2>問題がここに表示されます</h2>
  </div>

  <script>
    const WORKER_URL = "https://nanei-ai.hotaohyeah.workers.dev/";

    let currentAnswer = "";
    let currentExplanation = "";

    async function makeQuestion() {
      const grade = document.getElementById("grade").value;
      const subject = document.getElementById("subject").value;
      const btn = document.getElementById("genBtn");
      const qBox = document.getElementById("questions");

      btn.disabled = true;
      btn.innerText = "AIが問題を作成中...";
      qBox.innerHTML = "<h2>AIが問題を考えています...</h2>";

      const prompt = `あなたは中学校の先生です。${grade}の${subject}の練習問題を1問作成してください。
答えは生徒がキーボードで入力しやすいように、短い単語・数字・短い英文のいずれかにしてください。
必ず以下のJSON形式のみで出力してください。
{
  "question": "問題文",
  "answer": "正解（短い言葉や数字）",
  "explanation": "わかりやすい解説"
}`;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "エラーが発生しました");
        }

        const rawText = data.candidates.at(0).content.parts.at(0).text;
        const resultData = JSON.parse(rawText);

        currentAnswer = resultData.answer;
        currentExplanation = resultData.explanation;

        qBox.innerHTML = `
          <h2>${grade}・${subject}</h2>
          <p><b>問題</b></p>
          <p>${resultData.question}</p>
          <input id="answer" type="text" placeholder="答えを入力" style="padding: 8px;">
          <br><br>
          <button onclick="checkAnswer()">答え合わせ</button>
          <div id="result"></div>
        `;

      } catch (error) {
        qBox.innerHTML = `<h2>エラーが発生しました</h2><p>${error.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.innerText = "AIで問題を生成";
      }
    }

    function checkAnswer() {
      const userAnswer = document.getElementById("answer").value.trim();
      const resultDiv = document.getElementById("result");

      if (userAnswer === currentAnswer) {
        resultDiv.innerHTML = `
          <h3 style="color:lime">〇 正解！</h3>
          <p><b>解説：</b>${currentExplanation}</p>
        `;
      } else {
        resultDiv.innerHTML = `
          <h3 style="color:red">× 残念！</h3>
          <p><b>正解：</b>${currentAnswer}</p>
          <p><b>解説：</b>${currentExplanation}</p>
        `;
      }
    }
  </script>

</body>

</html>
