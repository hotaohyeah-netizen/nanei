<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>南映ログイン</h1>
</header>

<div class="card">

<input type="password" id="pass" placeholder="パスコードを入力">

<button onclick="login()">
ログイン
</button>

</div>

<script>
function login() {
  const inputPass = document.getElementById("pass").value;

  if (inputPass === "moriyama1-22-1") {
    // ログイン成功の印を保存
    sessionStorage.setItem("nanei_login", "ok");
    location.href = "menu.html";
  } else {
    alert("パスコードが違います");
  }
}

// Enterキーでもログインできるようにする
document.getElementById("pass").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    login();
  }
});
</script>

</body>
</html>
