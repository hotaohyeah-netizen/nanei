<!DOCTYPE html>
<html lang="ja">
<head>

<title>Hearts of Nanzan: マダガスカル王国の逆襲</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050d18;
  color: #f8fafc;
  font-family: sans-serif;
}

/* HoI4風 トップバー */
.hoi-topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 40;
  background: rgba(10, 18, 30, 0.95);
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  gap: 8px;
  overflow-x: auto;
}
.top-stats {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  white-space: nowrap;
}
.top-stat strong {
  color: #fde047;
  font-size: 13px;
}
.top-stat.navy-stat strong {
  color: #7dd3fc;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
button, select {
  background: #1e293b;
  color: #f8fafc;
  border: 1px solid #475569;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  cursor: pointer;
}
button:hover:not(:disabled) {
  background: #334155;
  border-color: #94a3b8;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button.primary {
  background: #1d4ed8;
  border-color: #60a5fa;
  font-weight: bold;
}

/* 画面いっぱいの世界地図ビューポート */
.map-viewport {
  position: fixed;
  top: 54px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0b192c;
  overflow: hidden;
  cursor: grab;
  user-select: none;
}
.map-viewport.dragging {
  cursor: grabbing;
}
.map-canvas {
  position: relative;
  width: 1400px;
  height: 616px;
  transform-origin: 0 0;
}
.map-bg-img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  filter: contrast(1.04) brightness(0.96);
}

/* 地図上の地域ノード */
.map-node {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: bold;
  color: #ffffff;
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
  cursor: pointer;
  white-space: nowrap;
}
.map-node:hover {
  transform: translate(-50%, -50%) scale(1.08);
  z-index: 12;
}
.map-node.selected {
  outline: 2px solid #fde047;
}

/* 地図上に直接表示する師団ユニットカウンター（HoI4風） */
.division-counter {
  position: absolute;
  transform: translate(-50%, -145%);
  z-index: 16;
  display: inline-flex;
  align-items: stretch;
  border-radius: 4px;
  overflow: hidden;
  border: 1.5px solid #f8fafc;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
  cursor: pointer;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}
.division-counter:hover {
  transform: translate(-50%, -145%) scale(1.08);
  z-index: 20;
}
.division-counter.selected-source {
  outline: 2.5px solid #fde047;
  box-shadow: 0 0 14px rgba(253, 224, 71, 0.85);
}
.div-icon-box {
  background: #0f172a;
  color: #fde047;
  padding: 2px 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.div-count-box {
  background: #16a34a;
  color: #ffffff;
  padding: 2px 7px;
  display: flex;
  align-items: center;
}
.division-counter.enemy .div-count-box {
  background: #dc2626;
}

/* 海軍艦隊ピン */
.fleet-pin {
  position: absolute;
  transform: translate(-50%, 45%);
  z-index: 14;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: bold;
  background: #0369a1;
  color: #e0f2fe;
  border: 1.5px solid #bae6fd;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
  cursor: pointer;
  white-space: nowrap;
}

.owner-madagascar { background: #15803d; }
.owner-france { background: #2563eb; }
.owner-germany { background: #6d28d9; }
.owner-uk { background: #1e3a8a; }
.owner-other { background: #b45309; }

/* 地図下部のコンパクト戦況バー */
.map-hud-bottom {
  position: fixed;
  left: 12px;
  bottom: 12px;
  z-index: 25;
  max-width: 780px;
  background: rgba(10, 18, 30, 0.92);
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
  backdrop-filter: blur(4px);
}
.map-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  font-size: 11px;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

/* フローティングウィンドウ */
.float-win {
  position: fixed;
  top: 72px;
  right: 18px;
  width: min(860px, calc(100vw - 36px));
  max-height: calc(100vh - 92px);
  z-index: 35;
  background: rgba(12, 20, 35, 0.96);
  border: 1px solid #475569;
  border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.float-win.open {
  display: flex;
}
.win-header {
  background: #1e293b;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  user-select: none;
  border-bottom: 1px solid #334155;
}
.win-title {
  font-weight: bold;
  font-size: 14px;
}
.win-body {
  padding: 12px 14px;
  overflow-y: auto;
  font-size: 12px;
}
.tab-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 8px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 8px;
}
.res-item, .focus-item, .mod-box, .prov-item, .line-box {
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 8px 10px;
  background: rgba(30, 41, 59, 0.55);
}
.res-item.done, .focus-item.done {
  border-color: #22c55e;
  background: rgba(22, 163, 74, 0.16);
}
.res-item.active, .focus-item.active {
  border-color: #eab308;
  background: rgba(234, 179, 8, 0.16);
}
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  font-weight: bold;
  background: rgba(59, 130, 246, 0.25);
  color: #93c5fd;
  margin-top: 4px;
}
.badge.done {
  background: rgba(34, 197, 94, 0.25);
  color: #86efac;
}
.bar-bg {
  width: 100%;
  height: 8px;
  background: #334155;
  border-radius: 999px;
  overflow: hidden;
  margin: 5px 0;
}
.bar-fill {
  height: 100%;
  background: #3b82f6;
}
.log-feed {
  max-height: 240px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.55;
}
</style>
</head>

</div>

let state = loadState();

function getTotalFactories() {
  return state.provinces
    .filter(p => p.owner === "madagascar")
    .reduce((sum, p) => sum + Math.max(0, Number(p.factories || 0)), 0);
}

function getTotalDocks() {
  return state.provinces
    .filter(p => p.owner === "madagascar")
    .reduce((sum, p) => sum + Math.max(0, Number(p.docks || 0)), 0);
}

function getUsedSlots(prov) {
  return (prov.factories || 0) + (prov.docks || 0) + Math.max(0, (prov.infra || 1) - 1);
}

function getMaxResearchSlots() {
  return FACTION_META[state.faction].slots + (state.bonusSlots || 0);
}

function getTotalPlayerDivisions() {
  return state.provinces
    .filter(p => p.owner === "madagascar")
    .reduce((sum, p) => sum + Math.max(0, Number(p.divisions || 0)), 0);
}

function clampProdLines() {
  const fac = getTotalFactories();
  const docks = getTotalDocks();
  const lines = state.prodLines;
  let landUsed = (lines.infantry || 0) + (lines.armor || 0) + (lines.air || 0);
  while (landUsed > fac) {
    if (lines.air > 0) lines.air -= 1;
    else if (lines.armor > 0) lines.armor -= 1;
    else if (lines.infantry > 0) lines.infantry -= 1;
    else break;
    landUsed = (lines.infantry || 0) + (lines.armor || 0) + (lines.air || 0);
  }
  if ((lines.navy || 0) > docks) {
    lines.navy = docks;
  }
}

const mapView = {
  scale: 1,
  tx: 0,
  ty: 0,
  isPanning: false,
  didPan: false,
  startX: 0,
  startY: 0,
  startTx: 0,
  startTy: 0
};

function applyTransform() {
  const canvas = document.getElementById("mapCanvas");
  if (!canvas) return;
  canvas.style.transform = `translate(${mapView.tx.toFixed(1)}px, ${mapView.ty.toFixed(1)}px) scale(${mapView.scale.toFixed(3)})`;
}

function initMapPanZoom() {
  const viewport = document.getElementById("mapViewport");
  if (!viewport) return;

  viewport.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    mapView.isPanning = true;
    mapView.didPan = false;
    mapView.startX = e.clientX;
    mapView.startY = e.clientY;
    mapView.startTx = mapView.tx;
    mapView.startTy = mapView.ty;
    viewport.classList.add("dragging");
  });

  window.addEventListener("mousemove", (e) => {
    if (!mapView.isPanning) return;
    const dx = e.clientX - mapView.startX;
    const dy = e.clientY - mapView.startY;
    if (Math.hypot(dx, dy) > 5) mapView.didPan = true;
    mapView.tx = mapView.startTx + dx;
    mapView.ty = mapView.startTy + dy;
    applyTransform();
  });

  window.addEventListener("mouseup", () => {
    if (!mapView.isPanning) return;
    mapView.isPanning = false;
    viewport.classList.remove("dragging");
    setTimeout(() => { mapView.didPan = false; }, 0);
  });

  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.18 : 0.85;
    const nextScale = Math.max(0.7, Math.min(8.0, mapView.scale * factor));
    const ratio = nextScale / mapView.scale;
    mapView.tx = px - (px - mapView.tx) * ratio;
    mapView.ty = py - (py - mapView.ty) * ratio;
    mapView.scale = nextScale;
    applyTransform();
  }, { passive: false });
}

function zoomAtCenter(factor) {
  const viewport = document.getElementById("mapViewport");
  if (!viewport) return;
  const rect = viewport.getBoundingClientRect();
  const px = rect.width * 0.5;
  const py = rect.height * 0.5;
  const nextScale = Math.max(0.7, Math.min(8.0, mapView.scale * factor));
  const ratio = nextScale / mapView.scale;
  mapView.tx = px - (px - mapView.tx) * ratio;
  mapView.ty = py - (py - mapView.ty) * ratio;
  mapView.scale = nextScale;
  applyTransform();
}

function setMapView(mode) {
  const viewport = document.getElementById("mapViewport");
  const vw = viewport ? viewport.clientWidth : window.innerWidth;
  const vh = viewport ? viewport.clientHeight : (window.innerHeight - 54);
  if (mode === "indian_ocean") {
    mapView.scale = 3.2;
    mapView.tx = vw * 0.45 - CANVAS_W * 0.62 * mapView.scale;
    mapView.ty = vh * 0.52 - CANVAS_H * 0.62 * mapView.scale;
  } else if (mode === "europe") {
    mapView.scale = 4.5;
    mapView.tx = vw * 0.48 - CANVAS_W * 0.50 * mapView.scale;
    mapView.ty = vh * 0.48 - CANVAS_H * 0.25 * mapView.scale;
  } else {
    mapView.scale = Math.max(0.7, Math.min(vw / CANVAS_W, vh / CANVAS_H));
    mapView.tx = (vw - CANVAS_W * mapView.scale) * 0.5;
    mapView.ty = (vh - CANVAS_H * mapView.scale) * 0.5;
  }
  applyTransform();
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) {
    return defaultState();
  }
}

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  log("セーブしました。");
  render();
}

function resetGame() {
  state = defaultState();
  localStorage.removeItem(SAVE_KEY);
  render();
}

function log(msg) {
  state.logs.unshift(`[T${state.turn}] ${msg}`);
  if (state.logs.length > 90) state.logs.pop();
}

function toggleWindow(id) {
  const win = document.getElementById(id);
  if (!win) return;
  win.classList.toggle("open");
}

function startDrag(e, winId) {
  const win = document.getElementById(winId);
  if (!win || e.target.tagName === "BUTTON") return;
  const rect = win.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  win.style.left = rect.left + "px";
  win.style.top = rect.top + "px";
  win.style.right = "auto";

  function onMove(ev) {
    win.style.left = Math.max(8, Math.min(window.innerWidth - 160, ev.clientX - offsetX)) + "px";
    win.style.top = Math.max(58, Math.min(window.innerHeight - 80, ev.clientY - offsetY)) + "px";
  }
  function onUp() {
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  }
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
}

function changeFaction(f) {
  state.faction = f;
  state.nfTab = f;
  const meta = FACTION_META[f];
  const home = state.provinces.find(p => p.owner === "madagascar");
  if (home) {
    if (f === "comintern") home.factories = Math.min(home.maxSlots, Math.max(home.factories, 7));
    else if (f === "axis") home.factories = Math.min(home.maxSlots, Math.max(home.factories, 6));
  }
  const maxSlots = getMaxResearchSlots();
  while (state.activeResearch.length > maxSlots) {
    state.activeResearch.pop();
  }
  log(`陣営を「${meta.label}」（研究枠 ${maxSlots}）に変更。`);
  render();
}

function setTechTab(tab) {
  state.activeTechTab = tab;
  render();
}

function setNfTab(tab) {
  state.nfTab = tab;
  render();
}

function setBuildTab(tab) {
  state.buildTab = tab;
  render();
}

function selectBuildProv(id) {
  state.selectedBuildProvId = id;
  render();
}

function buildInProvince(provId, kind) {
  const prov = state.provinces.find(p => p.id === provId);
  if (!prov || prov.owner !== "madagascar") return;
  const cap = FACTION_META[state.faction].buildCap;
  const dockCap = FACTION_META[state.faction].dockCap;
  const ownedCount = state.provinces.filter(p => p.owner === "madagascar").length;

  if (kind === "factory") {
    if (state.builtFactoriesThisTurn >= cap || state.pp < 15 || getUsedSlots(prov) >= prov.maxSlots) return;
    state.pp -= 15;
    prov.factories += 1;
    state.builtFactoriesThisTurn += 1;
    state.armyPower += 6;
    log(`${prov.name}に軍需工場を建設（${getUsedSlots(prov)}/${prov.maxSlots}枠）。`);
  } else if (kind === "dock") {
    if (state.builtDocksThisTurn >= dockCap || state.pp < 20 || ownedCount < 2 || getUsedSlots(prov) >= prov.maxSlots) return;
    state.pp -= 20;
    prov.docks += 1;
    state.builtDocksThisTurn += 1;
    state.navyPower += 8;
    log(`${prov.name}に造船所を建設（${getUsedSlots(prov)}/${prov.maxSlots}枠）。`);
  } else if (kind === "infra") {
    if (state.builtFactoriesThisTurn >= cap || state.pp < 12 || (prov.infra || 1) >= 5) return;
    state.pp -= 12;
    prov.infra = (prov.infra || 1) + 1;
    prov.maxSlots += 2;
    state.builtFactoriesThisTurn += 1;
    state.armyPower += 5;
    log(`${prov.name}のインフラをLv.${prov.infra}へ強化（上限${prov.maxSlots}枠に拡張）。`);
  }
  render();
}

function adjustProdLine(lineKey, delta) {
  const lines = state.prodLines;
  const fac = getTotalFactories();
  const docks = getTotalDocks();
  const landUsed = (lines.infantry || 0) + (lines.armor || 0) + (lines.air || 0);

  if (lineKey === "navy") {
    const next = (lines.navy || 0) + delta;
    if (next < 0 || next > docks) return;
    lines.navy = next;
  } else {
    const next = (lines[lineKey] || 0) + delta;
    if (next < 0 || landUsed + delta > fac) return;
    lines[lineKey] = next;
  }
  render();
}

function handleDivisionCounterClick(provId) {
  if (mapView.didPan) return;
  const prov = state.provinces.find(p => p.id === provId);
  if (!prov) return;
  if (prov.owner === "madagascar" && prov.divisions > 0) {
    state.selectedSourceProvId = prov.id;
    state.selectedBuildProvId = prov.id;
    state.activeMarkerId = prov.id;
    document.getElementById("mapInfoBox").textContent =
      `${prov.name}の師団（${prov.divisions}個師団）を選択中。移動先または敵領をクリックして進軍！`;
    render();
  } else {
    handleNodeClick(provId);
  }
}

function handleNodeClick(provId) {
  if (mapView.didPan) return;
  state.activeMarkerId = provId;
  const target = state.provinces.find(p => p.id === provId);
  if (!target) return;

  const src = state.provinces.find(p => p.id === state.selectedSourceProvId && p.owner === "madagascar");

  if (target.owner === "madagascar") {
    state.selectedBuildProvId = target.id;
    if (src && src.id !== target.id && src.divisions > 1) {
      const moving = Math.max(1, Math.floor(src.divisions / 2));
      src.divisions -= moving;
      target.divisions += moving;
      state.selectedSourceProvId = target.id;
      const msg = `${src.name}から${target.name}へ ${moving}個師団を移動しました。`;
      document.getElementById("mapInfoBox").textContent = msg;
      log(msg);
      render();
      return;
    }
    state.selectedSourceProvId = target.id;
    document.getElementById("mapInfoBox").textContent =
      `${target.name}：自軍支配下（${target.divisions}個師団 / 工場${target.factories} / 造船${target.docks} / 枠${getUsedSlots(target)}/${target.maxSlots}）。`;
    render();
    return;
  }

  attackProvince(target.id, src);
}

function handleFleetClick(fleetId) {
  if (mapView.didPan) return;
  const fl = state.fleets.find(f => f.id === fleetId);
  if (!fl) return;
  state.navyPower += 8;
  document.getElementById("mapInfoBox").textContent = `${fl.name}（${fl.ships}隻）が海域哨戒・砲撃支援を展開！海戦力 ${state.navyPower}。`;
  log(`${fl.name}が哨戒支援を実施（海戦力 ${state.navyPower}）。`);
  render();
}

function recruitDivision() {
  if (state.pp < 10 || state.manpower < 2000) return;
  state.pp -= 10;
  state.manpower -= 2000;
  state.armyPower += 18;
  const home = state.provinces.find(p => p.id === state.selectedSourceProvId && p.owner === "madagascar")
    || state.provinces.find(p => p.owner === "madagascar");
  if (home) {
    home.divisions += 1;
    state.selectedSourceProvId = home.id;
    log(`${home.name}に陸軍師団を1個編成（合計 ${getTotalPlayerDivisions()}個師団）。`);
  }
  render();
}

function buildShip() {
  if (state.pp < 15 || getTotalDocks() < 1) return;
  state.pp -= 15;
  state.ships += 1;
  const m = state.modules.navy;
  state.navyPower += 8 + m.atk * 2 + m.def;
  if (state.fleets.length > 0) state.fleets[0].ships += 1;
  log(`海軍艦艇を1隻建造（合計 ${state.ships}隻 / 海戦力 ${state.navyPower}）。`);
  render();
}

function getAllTechs() {
  return [...TECH_ITEMS.army, ...TECH_ITEMS.navy, ...TECH_ITEMS.air];
}

function startTech(id) {
  const slots = getMaxResearchSlots();
  if (state.activeResearch.length >= slots) return;
  if (state.completedTechs.includes(id) || state.activeResearch.some(r => r.id === id)) return;
  const tech = getAllTechs().find(t => t.id === id);
  if (!tech) return;
  if (tech.req && !state.completedTechs.includes(tech.req)) return;
  state.activeResearch.push({ id: tech.id, progress: 0 });
  log(`研究開始：${tech.name}`);
  render();
}

function adjustMod(group, stat, delta) {
  const m = state.modules[group];
  const nextVal = m[stat] + delta;
  if (nextVal < 0 || nextVal > 7) return;
  const sum = m.atk + m.def + m.cost + delta;
  if (sum < 0 || sum > 10) return;
  m[stat] = nextVal;
  if (group === "navy") {
    state.navyPower = Math.max(20, state.ships * 8 + m.atk * 5 + m.def * 3);
  }
  render();
}

function startNF(id) {
  if (state.currentNF || state.completedNFs.includes(id)) return;
  const nf = NF_LIST.find(n => n.id === id);
  if (!nf) return;
  if (nf.req && !state.completedNFs.includes(nf.req)) return;
  state.currentNF = id;
  state.nfProgress = 0;
  log(`方針着手：${nf.name}`);
  render();
}

function applyNFEffect(nf) {
  const e = nf.eff || {};
  const home = state.provinces.find(p => p.id === state.selectedBuildProvId && p.owner === "madagascar")
    || state.provinces.find(p => p.owner === "madagascar");
  if (e.pp) state.pp += e.pp;
  if (e.fac && home) home.factories = Math.min(home.maxSlots + 4, (home.factories || 0) + e.fac);
  if (e.dock && home) home.docks = Math.min(home.maxSlots + 2, (home.docks || 0) + e.dock);
  if (e.mp) state.manpower += e.mp;
  if (e.army) state.armyPower += e.army;
  if (e.navy) state.navyPower += e.navy;
  if (e.ships) {
    state.ships += e.ships;
    if (state.fleets.length > 0) state.fleets[0].ships += e.ships;
  }
  if (e.slot) {
    state.bonusSlots = Math.min(3, (state.bonusSlots || 0) + e.slot);
  }
  if (e.div && home) {
    home.divisions += e.div;
  }
  if (e.route) {
    state.madagascarRoute = e.route;
  }
  if (Array.isArray(e.annex)) {
    e.annex.forEach(pid => {
      const p = state.provinces.find(x => x.id === pid);
      if (p) {
        p.owner = "madagascar";
        p.enemyPower = 0;
        p.divisions = Math.max(2, p.divisions);
      }
    });
  }
  log(`方針完了：${nf.name}`);
}

function attackProvince(provId, srcProv) {
  const p = state.provinces.find(x => x.id === provId);
  if (!p || p.owner === "madagascar") return;
  const attackerDivs = srcProv && srcProv.divisions > 1 ? Math.max(1, Math.floor(srcProv.divisions / 2)) : 1;
  const effectivePower = state.armyPower + attackerDivs * 14 + Math.round(state.navyPower * 0.35);

  if (effectivePower >= p.enemyPower) {
    if (srcProv && srcProv.divisions > 1) {
      srcProv.divisions -= attackerDivs;
    }
    state.armyPower = Math.max(30, state.armyPower - Math.round(p.enemyPower * 0.15));
    p.owner = "madagascar";
    p.enemyPower = 0;
    p.divisions = attackerDivs;
    state.selectedSourceProvId = p.id;
    state.selectedBuildProvId = p.id;
    const msg = `${p.name}を制圧（${attackerDivs}個師団展開）！`;
    log(msg);
    document.getElementById("mapInfoBox").textContent = msg;
  } else {
    if (srcProv && srcProv.divisions > 1) {
      srcProv.divisions -= 1;
      p.divisions = Math.max(1, p.divisions - 1);
    }
    state.armyPower = Math.max(20, state.armyPower - Math.round(state.armyPower * 0.12));
    p.enemyPower = Math.max(20, p.enemyPower - Math.round(effectivePower * 0.35));
    const msg = `${p.name}と交戦中（敵残存 ${p.enemyPower} / 敵${p.divisions}師団）。`;
    log(msg);
    document.getElementById("mapInfoBox").textContent = msg;
  }
  render();
}

function applyProductionLines() {
  clampProdLines();
  const lines = state.prodLines;
  const home = state.provinces.find(p => p.id === state.selectedBuildProvId && p.owner === "madagascar")
    || state.provinces.find(p => p.owner === "madagascar");

  const infGain = (lines.infantry || 0) * 5;
  const armGain = (lines.armor || 0) * 8;
  const airGain = (lines.air || 0) * 6;
  const navyGain = (lines.navy || 0) * (6 + (state.modules.navy.atk || 0));

  state.armyPower += infGain + armGain + airGain;
  state.navyPower += navyGain;

  if (home && (lines.infantry || 0) >= 4 && state.manpower >= 1500) {
    home.divisions += 1;
    state.manpower -= 1500;
    log(`生産ライン完了：${home.name}に歩兵師団+1、陸戦力+${infGain + armGain + airGain}`);
  } else if ((infGain + armGain + airGain) > 0 || navyGain > 0) {
    log(`生産ライン稼働：陸戦力+${infGain + armGain + airGain}、海戦力+${navyGain}`);
  }

  if ((lines.navy || 0) >= 2) {
    state.ships += 1;
    if (state.fleets.length > 0) state.fleets[0].ships += 1;
  }
}

function advanceTurn() {
  state.turn += 1;
  state.pp = Number((state.pp + 8).toFixed(1));
  state.manpower += 400 + getTotalFactories() * 25;
  state.builtFactoriesThisTurn = 0;
  state.builtDocksThisTurn = 0;

  applyProductionLines();

  const doneRes = [];
  state.activeResearch.forEach(item => {
    const tech = getAllTechs().find(t => t.id === item.id);
    if (!tech) return;
    item.progress += 1;
    if (item.progress >= tech.turns) {
      state.completedTechs.push(tech.id);
      if (TECH_ITEMS.navy.some(n => n.id === tech.id)) {
        state.navyPower += tech.dmg + tech.def;
      } else {
        state.armyPower += tech.dmg + tech.def;
      }
      doneRes.push(item.id);
      log(`研究完了：${tech.name}`);
    }
  });
  state.activeResearch = state.activeResearch.filter(x => !doneRes.includes(x.id));

  if (state.currentNF) {
    const nf = NF_LIST.find(n => n.id === state.currentNF);
    if (nf) {
      state.nfProgress += 1;
      if (state.nfProgress >= nf.turns) {
        state.completedNFs.push(nf.id);
        const doneNf = nf;
        state.currentNF = null;
        state.nfProgress = 0;
        applyNFEffect(doneNf);
      }
    }
  }

  state.provinces.forEach(p => {
    if (p.owner !== "madagascar") p.enemyPower += 5;
  });

  render();
}

function renderMapNodes() {
  const layer = document.getElementById("mapNodesLayer");
  if (layer) {
    layer.innerHTML = state.provinces.map(p => {
      const cls = `map-node owner-${p.owner} ${state.activeMarkerId === p.id ? "selected" : ""}`;
      const sub = p.owner === "madagascar" ? `工${p.factories}/枠${getUsedSlots(p)}/${p.maxSlots}` : `防${p.enemyPower}`;
      return `<div class="${cls}" style="left:${p.xPct}%; top:${p.yPct}%;" onclick="handleNodeClick('${p.id}')">${p.name} (${sub})</div>`;
    }).join("");
  }

  const divLayer = document.getElementById("divisionCountersLayer");
  if (divLayer) {
    divLayer.innerHTML = state.provinces
      .filter(p => p.divisions > 0)
      .map(p => {
        const isEnemy = p.owner !== "madagascar";
        const isSelected = !isEnemy && state.selectedSourceProvId === p.id;
        return `
          <div class="division-counter ${isEnemy ? "enemy" : ""} ${isSelected ? "selected-source" : ""}"
               style="left:${p.xPct}%; top:${p.yPct}%;"
               onclick="handleDivisionCounterClick('${p.id}')">
            <span class="div-icon-box">⚔</span>
            <span class="div-count-box">${p.divisions}</span>
          </div>
        `;
      }).join("");
  }

  const fleetLayer = document.getElementById("fleetPinsLayer");
  if (fleetLayer) {
    fleetLayer.innerHTML = state.fleets.map(fl => `
      <div class="fleet-pin" style="left:${fl.xPct}%; top:${fl.yPct}%;" onclick="handleFleetClick('${fl.id}')">
        ⚓ ${fl.name} (${fl.ships}隻)
      </div>
    `).join("");
  }
}

function renderBuildWindow() {
  clampProdLines();
  const container = document.getElementById("buildContent");
  const meta = FACTION_META[state.faction];
  const totalFac = getTotalFactories();
  const totalDocks = getTotalDocks();
  const totalDivs = getTotalPlayerDivisions();
  const ownedCount = state.provinces.filter(p => p.owner === "madagascar").length;
  const ownedProvs = state.provinces.filter(p => p.owner === "madagascar");
  const targetProv = ownedProvs.find(p => p.id === state.selectedBuildProvId) || ownedProvs[0];

  if (state.buildTab === "province") {
    const used = targetProv ? getUsedSlots(targetProv) : 0;
    const remFac = Math.max(0, meta.buildCap - state.builtFactoriesThisTurn);
    const remDock = Math.max(0, meta.dockCap - state.builtDocksThisTurn);
    container.innerHTML = `
      <div style="margin-bottom:8px;">
        対象プロヴィンス：
        <select onchange="selectBuildProv(this.value)">
          ${ownedProvs.map(p => `<option value="${p.id}" ${targetProv && p.id === targetProv.id ? "selected" : ""}>${p.name}（枠 ${getUsedSlots(p)}/${p.maxSlots}・工${p.factories}・船${p.docks}・インフラLv.${p.infra || 1}）</option>`).join("")}
        </select>
        <span style="margin-left:8px;">今ターン建設枠：工<strong>${remFac}</strong> / 船<strong>${remDock}</strong></span>
      </div>
      ${targetProv ? `
        <div class="grid-3">
          <div class="prov-item">
            <strong>軍需工場（1枠 / PP 15）</strong><br>
            現在: <strong>${targetProv.factories}</strong> ／ スロット: <strong>${used}/${targetProv.maxSlots}</strong><br>
            <button style="margin-top:6px;" ${state.builtFactoriesThisTurn >= meta.buildCap || state.pp < 15 || used >= targetProv.maxSlots ? "disabled" : ""} onclick="buildInProvince('${targetProv.id}', 'factory')">+1 軍需工場を建設</button>
          </div>
          <div class="prov-item">
            <strong>海軍造船所（1枠 / PP 20）</strong><br>
            現在: <strong>${targetProv.docks}</strong> ／ 占領地2以上（現在${ownedCount}）<br>
            <button style="margin-top:6px;" ${state.builtDocksThisTurn >= meta.dockCap || state.pp < 20 || ownedCount < 2 || used >= targetProv.maxSlots ? "disabled" : ""} onclick="buildInProvince('${targetProv.id}', 'dock')">+1 造船所を建設</button>
          </div>
          <div class="prov-item">
            <strong>インフラ強化（上限+2枠 / PP 12）</strong><br>
            現在: <strong>Lv.${targetProv.infra || 1}/5</strong> ／ 最大枠: <strong>${targetProv.maxSlots}</strong><br>
            <button style="margin-top:6px;" ${state.builtFactoriesThisTurn >= meta.buildCap || state.pp < 12 || (targetProv.infra || 1) >= 5 ? "disabled" : ""} onclick="buildInProvince('${targetProv.id}', 'infra')">+1 インフラ強化</button>
          </div>
        </div>
      ` : "<div>自軍支配プロヴィンスがありません。</div>"}
    `;
    return;
  }

  if (state.buildTab === "lines") {
    const lines = state.prodLines;
    const landUsed = (lines.infantry || 0) + (lines.armor || 0) + (lines.air || 0);
    container.innerHTML = `
      <div style="margin-bottom:8px;">
        軍需工場割当：<strong>${landUsed} / ${totalFac}</strong> ／ 造船所割当：<strong>${lines.navy || 0} / ${totalDocks}</strong>
      </div>
      <div class="grid-2">
        <div class="line-box">
          <strong>① 歩兵装備・野砲ライン</strong>（割当: <strong>${lines.infantry || 0}</strong> 工場）<br>
          <small>毎ターン陸戦力+${(lines.infantry || 0) * 5}（4以上割当で歩兵師団+1）</small><br>
          <button style="margin-top:6px;" onclick="adjustProdLine('infantry', -1)">-</button>
          <button style="margin-top:6px;" onclick="adjustProdLine('infantry', 1)">+</button>
        </div>
        <div class="line-box">
          <strong>② 戦車・対空砲ライン</strong>（割当: <strong>${lines.armor || 0}</strong> 工場）<br>
          <small>毎ターン陸戦力+${(lines.armor || 0) * 8}</small><br>
          <button style="margin-top:6px;" onclick="adjustProdLine('armor', -1)">-</button>
          <button style="margin-top:6px;" onclick="adjustProdLine('armor', 1)">+</button>
        </div>
        <div class="line-box">
          <strong>③ 戦闘機・CAS航空ライン</strong>（割当: <strong>${lines.air || 0}</strong> 工場）<br>
          <small>毎ターン陸戦力+${(lines.air || 0) * 6}</small><br>
          <button style="margin-top:6px;" onclick="adjustProdLine('air', -1)">-</button>
          <button style="margin-top:6px;" onclick="adjustProdLine('air', 1)">+</button>
        </div>
        <div class="line-box">
          <strong>④ 艦艇・潜水艇ライン</strong>（割当: <strong>${lines.navy || 0}</strong> 造船所）<br>
          <small>毎ターン海戦力+${(lines.navy || 0) * (6 + (state.modules.navy.atk || 0))}（2以上割当で艦艇+1）</small><br>
          <button style="margin-top:6px;" onclick="adjustProdLine('navy', -1)">-</button>
          <button style="margin-top:6px;" onclick="adjustProdLine('navy', 1)">+</button>
        </div>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="grid-2">
      <div class="prov-item">
        <strong>陸軍師団を編成</strong>（現在: <strong>${totalDivs}</strong> 個師団 ／ 必要: PP 10 + 人的 2,000）<br>
        <button style="margin-top:6px;" ${state.pp < 10 || state.manpower < 2000 ? "disabled" : ""} onclick="recruitDivision()">+1 師団を編成</button>
      </div>
      <div class="prov-item">
        <strong>海軍艦艇を建造</strong>（現在: <strong>${state.ships}</strong> 隻 ／ 海戦力: <strong>${state.navyPower}</strong> ／ 必要: PP 15 + 造船所1以上）<br>
        <button style="margin-top:6px;" ${state.pp < 15 || totalDocks < 1 ? "disabled" : ""} onclick="buildShip()">+1 艦艇を建造</button>
      </div>
    </div>
  `;
}

function renderTechArea() {
  const container = document.getElementById("techContent");
  const slots = getMaxResearchSlots();

  if (state.activeTechTab === "modules") {
    container.innerHTML = ["navy", "air"].map(group => {
      const m = state.modules[group];
      const used = m.atk + m.def + m.cost;
      const title = group === "navy" ? "海軍・潜水艇モジュール（10pt・各最大7）" : "空軍モジュール（10pt・各最大7）";
      return `
        <div class="mod-box" style="margin-bottom:8px;">
          <strong>${title}</strong>（使用: <strong>${used} / 10</strong>）<br>
          <div style="margin-top:6px;">
            攻撃: <strong>${m.atk}</strong>/7
            <button onclick="adjustMod('${group}','atk',-1)">-</button>
            <button onclick="adjustMod('${group}','atk',1)">+</button>
            ／ 防御: <strong>${m.def}</strong>/7
            <button onclick="adjustMod('${group}','def',-1)">-</button>
            <button onclick="adjustMod('${group}','def',1)">+</button>
            ／ コスト減少: <strong>${m.cost}</strong>/7
            <button onclick="adjustMod('${group}','cost',-1)">-</button>
            <button onclick="adjustMod('${group}','cost',1)">+</button>
          </div>
        </div>
      `;
    }).join("");
    return;
  }

  const list = TECH_ITEMS[state.activeTechTab] || [];
  container.innerHTML = `
    <div style="margin-bottom:8px;">研究枠：<strong>${state.activeResearch.length} / ${slots}</strong></div>
    <div class="grid-3">
      ${list.map(t => {
        const done = state.completedTechs.includes(t.id);
        const active = state.activeResearch.find(r => r.id === t.id);
        const reqOk = !t.req || state.completedTechs.includes(t.req);
        const label = state.faction === "madagascar"
          ? t.name.replace("歩兵銃", "南山銃").replace("戦車", "バオバブ戦車")
          : t.name;
        return `
          <div class="res-item ${done ? "done" : active ? "active" : ""}">
            <strong>${label}</strong> (${t.turns}T)<br>
            <small>攻+${t.dmg} / 防+${t.def}</small><br>
            ${done ? '<span class="badge done">完了</span>' :
              active ? `<span class="badge">進行中 ${active.progress}/${t.turns}</span>` :
              `<button style="margin-top:5px;" ${(!reqOk || state.activeResearch.length >= slots) ? "disabled" : ""} onclick="startTech('${t.id}')">${reqOk ? "研究開始" : "前提必要"}</button>`}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderNF() {
  const box = document.getElementById("activeFocusBox");
  if (state.currentNF) {
    const cur = NF_LIST.find(n => n.id === state.currentNF);
    const pct = Math.min(100, Math.round((state.nfProgress / cur.turns) * 100));
    box.innerHTML = `進行中：<strong>${cur.name}</strong>（${state.nfProgress}/${cur.turns}T）<div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>`;
  } else {
    box.innerHTML = `進行中：<strong>なし</strong>（完了済み: ${state.completedNFs.length} / ${NF_LIST.length}個）`;
  }

  const list = NF_LIST.filter(n => n.faction === state.nfTab);
  document.getElementById("focusList").innerHTML = `<div class="grid-2">` + list.map(nf => {
    const done = state.completedNFs.includes(nf.id);
    const active = state.currentNF === nf.id;
    const reqOk = !nf.req || state.completedNFs.includes(nf.req);
    const reqName = nf.req ? (NF_LIST.find(x => x.id === nf.req)?.name || nf.req) : "なし";
    return `
      <div class="focus-item ${done ? "done" : active ? "active" : ""}">
        <strong>${nf.name}</strong> (${nf.turns}T)<br>
        <small>${nf.desc}</small><br>
        <small style="color:#94a3b8;">前提: ${reqName}</small><br>
        ${done ? '<span class="badge done">完了</span>' :
          active ? '<span class="badge">進行中</span>' :
          `<button style="margin-top:5px;" ${(!reqOk || state.currentNF) ? "disabled" : ""} onclick="startNF('${nf.id}')">${reqOk ? "方針選択" : "前提必要"}</button>`}
      </div>
    `;
  }).join("") + `</div>`;
}

function render() {
  clampProdLines();
  const meta = FACTION_META[state.faction];
  const slots = getMaxResearchSlots();
  const totalFac = getTotalFactories();
  const totalDocks = getTotalDocks();
  const totalDivs = getTotalPlayerDivisions();
  document.getElementById("factionSelect").value = state.faction;
  document.getElementById("dispTurn").textContent = state.turn;
  document.getElementById("dispFaction").textContent = meta.label;
  document.getElementById("dispDivisions").textContent = `${totalDivs}個`;
  document.getElementById("dispNavy").textContent = `${state.ships}隻 / 海戦力${state.navyPower}`;
  document.getElementById("dispResSlots").textContent = `${state.activeResearch.length}/${slots}`;
  document.getElementById("dispPP").textContent = Math.floor(state.pp);
  document.getElementById("dispFactories").textContent = `${totalFac}/${totalDocks}`;
  document.getElementById("dispManpower").textContent = state.manpower.toLocaleString();
  document.getElementById("dispArmyPower").textContent = state.armyPower;

  renderMapNodes();
  renderBuildWindow();
  renderTechArea();
  renderNF();
  document.getElementById("eventLog").innerHTML = state.logs.map(l => `<div>${l}</div>`).join("");
}

initMapPanZoom();
setMapView("world");
render();
</script>
</body>
</html>
